name: CI - Chatty

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v6.0.0
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: client/package-lock.json

        - run: npm ci
        - run: npm run dev
          env:
            VITE_PATH_SERVER: ${{ secrets.VITE_PATH_SERVER }}