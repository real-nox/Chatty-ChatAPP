name: CI - Chatty

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Boot check
        run: |
          npm run test &
          SERVER_PID=$!

          for i in {1..10}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done

          echo "Server failed to start within 10s"
          kill $SERVER_PID 2>/dev/null
          exit 1
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIENT_PATH: https://chatty-82wa.onrender.com
          SERVER_PATH: https://api-chatty-12ji.onrender.com
          PRODUCTION: false
          SSSKEY: ${{ secrets.SSSKEY }}

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v6.0.0
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: client/package-lock.json

        - run: npm ci
        - run: npm run build
          env:
            VITE_PATH_SERVER: ${{ secrets.VITE_PATH_SERVER }}